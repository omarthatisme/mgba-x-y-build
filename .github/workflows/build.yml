name: Build mGBA 0.10.5 X/Y Windows x64

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Check out build files
        uses: actions/checkout@v4

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            unzip
            zip
            mingw-w64-ucrt-x86_64-ntldd-git
          pacboy: >-
            toolchain:p
            cmake:p
            ninja:p
            ffmpeg:p
            libelf:p
            libepoxy:p
            libzip:p
            lua:p
            pkgconf:p
            qt5:p
            qt5-tools:p
            SDL2:p

      - name: Check out upstream mGBA 0.10.5
        run: git clone --depth 1 --branch 0.10.5 https://github.com/mgba-emu/mgba.git mgba

      - name: Apply X/Y source edits
        run: |
          python .github/apply_xy.py
          cd mgba
          git diff --check
          git diff --stat

      - name: Configure
        run: |
          cd mgba
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DDISTBUILD=ON -DBUILD_QT=ON -DBUILD_SDL=ON

      - name: Build
        run: |
          cd mgba
          cmake --build build --parallel $(nproc)

      - name: Package clean Qt build
        run: |
          cd mgba/build

          # Use mGBA's own CPack distribution mechanism. The project
          # documents cpack -G ZIP as the supported way to produce a
          # distributable Windows build with its required runtime DLLs.
          rm -f ./*.zip
          cpack -G ZIP -D CPACK_ARCHIVE_COMPONENT_INSTALL=OFF

          # CPack should have produced exactly one distributable ZIP.
          mapfile -t PACKAGES < <(find . -maxdepth 1 -type f -name 'mGBA-*.zip' -printf '%f\n')
          test "${#PACKAGES[@]}" -eq 1
          PKG="${PACKAGES[0]}"

          # Verify the archive is readable and show its contents for the log.
          unzip -t "$PKG"
          echo "CPack package:"
          echo "$PKG"
          unzip -Z1 "$PKG" | sed -n '1,160p'

          # Rename the CPack output to the X/Y build name used by the artifact.
          mv "$PKG" ../../mGBA-0.10.5-X-Y-win64.zip
          test -s ../../mGBA-0.10.5-X-Y-win64.zip

      - name: Upload finished package
        uses: actions/upload-artifact@v4
        with:
          name: mGBA-0.10.5-X-Y-win64
          path: mGBA-0.10.5-X-Y-win64.zip
          if-no-files-found: error
