name: Build mGBA 0.10.5 X/Y Windows x64

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Check out build files
        uses: actions/checkout@v4

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            unzip
            zip
            mingw-w64-ucrt-x86_64-ntldd-git
          pacboy: >-
            toolchain:p
            cmake:p
            ninja:p
            ffmpeg:p
            libelf:p
            libepoxy:p
            libzip:p
            lua:p
            pkgconf:p
            qt5:p
            qt5-tools:p
            SDL2:p

      - name: Check out upstream mGBA 0.10.5
        run: git clone --depth 1 --branch 0.10.5 https://github.com/mgba-emu/mgba.git mgba

      - name: Apply X/Y source edits
        run: |
          python .github/apply_xy.py
          cd mgba
          git diff --check
          git diff --stat

      - name: Configure
        run: |
          cd mgba
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DDISTBUILD=ON -DBUILD_QT=ON -DBUILD_SDL=ON

      - name: Build
        run: |
          cd mgba
          cmake --build build --parallel $(nproc)

      - name: Package clean Qt build
        run: |
          cd mgba/build

          # mGBA's Windows install script expects the Qt executable at
          # build/qt/mGBA.exe, while the Windows target actually outputs
          # build/mGBA.exe. Give CPack the expected path without changing
          # the real build output.
          test -f mGBA.exe
          mkdir -p qt
          cp -f mGBA.exe qt/mGBA.exe

          # MSYS2 names the Qt 5 deployment tool windeployqt-qt5.exe.
          # mGBA's deploy-win.sh calls it as "windeployqt", so provide a
          # small PATH wrapper for that exact command.
          mkdir -p /tmp/mgba-bin
          cat > /tmp/mgba-bin/windeployqt <<'EOF'
          #!/bin/bash
          exec /ucrt64/bin/windeployqt-qt5.exe "$@"
          EOF
          chmod +x /tmp/mgba-bin/windeployqt
          export PATH="/tmp/mgba-bin:$PATH"
          command -v windeployqt
          command -v ntldd

          # Use mGBA's own CPack distribution mechanism, but request only
          # the runtime components needed by the desktop build.
          rm -f ./*.zip
          cpack -G ZIP -D CPACK_ARCHIVE_COMPONENT_INSTALL=OFF -D 'CPACK_COMPONENTS_ALL=mgba;libmgba;mgba-qt;mgba-sdl'

          # CPack should have produced exactly one distributable ZIP.
          mapfile -t PACKAGES < <(find . -maxdepth 1 -type f -name 'mGBA-*.zip' -printf '%f\n')
          test "${#PACKAGES[@]}" -eq 1
          PKG="${PACKAGES[0]}"

          unzip -t "$PKG"
          echo "CPack package (before dependency repair):"
          echo "$PKG"
          unzip -Z1 "$PKG" | sed -n '1,160p'

          # CPack's mgba-qt component runs upstream mGBA's
          # tools/deploy-win.sh to gather runtime DLLs, but that script
          # filters dependencies with `grep -i mingw`, which only
          # matches a classic /mingw64 MSYS2 layout. This workflow
          # builds with MSYS2 UCRT64, so runtime DLLs resolve under
          # /ucrt64/... instead and are silently dropped (compiler
          # runtime DLLs, FFmpeg's swscale, etc). windeployqt still
          # runs correctly, so Qt itself is unaffected.
          #
          # Rather than patch the vendored mGBA source, discover and
          # repair the actual runtime dependency closure of the staged
          # package ourselves, using the same MSYS2/MinGW tooling
          # (ntldd, with objdump as a fallback).
          STAGE_DIR="$(mktemp -d)"
          unzip -q "$PKG" -d "$STAGE_DIR"

          bash "$GITHUB_WORKSPACE/.github/scripts/collect_runtime_dlls.sh" "$STAGE_DIR" /ucrt64

          # Sanity-check the specific DLLs previously confirmed missing
          # on a clean Windows machine, in addition to the generic
          # closure check the script itself performs.
          EXE_DIR="$(dirname "$(find "$STAGE_DIR" -iname 'mGBA.exe' -print -quit)")"
          for required in libwinpthread-1.dll libstdc++-6.dll libgcc_s_seh-1.dll swscale-10.dll; do
            test -f "$EXE_DIR/$required"
          done
          test -f "$EXE_DIR/platforms/qwindows.dll"

          rm -f "$PKG"
          (cd "$STAGE_DIR" && zip -r -q -X "$OLDPWD/$PKG" .)

          echo "CPack package (after dependency repair):"
          echo "$PKG"
          unzip -Z1 "$PKG" | sed -n '1,200p'

          mv "$PKG" ../../mGBA-0.10.5-X-Y-win64.zip
          test -s ../../mGBA-0.10.5-X-Y-win64.zip

      - name: Upload finished package
        uses: actions/upload-artifact@v4
        with:
          name: mGBA-0.10.5-X-Y-win64
          path: mGBA-0.10.5-X-Y-win64.zip
          if-no-files-found: error
