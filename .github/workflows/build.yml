name: Build mGBA 0.10.5 X/Y Windows x64

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Check out build files
        uses: actions/checkout@v4

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            unzip
            zip
            mingw-w64-ucrt-x86_64-ntldd-git
          pacboy: >-
            toolchain:p
            cmake:p
            ninja:p
            ffmpeg:p
            libelf:p
            libepoxy:p
            libzip:p
            lua:p
            pkgconf:p
            qt5:p
            SDL2:p

      - name: Check out upstream mGBA 0.10.5
        run: git clone --depth 1 --branch 0.10.5 https://github.com/mgba-emu/mgba.git mgba

      - name: Apply X/Y source edits
        run: |
          python .github/apply_xy.py
          cd mgba
          git diff --check
          git diff --stat

      - name: Configure
        run: |
          cd mgba
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DDISTBUILD=ON -DBUILD_QT=ON -DBUILD_SDL=ON

      - name: Build
        run: |
          cd mgba
          cmake --build build --parallel $(nproc)

      - name: Package clean Qt build
        run: |
          cd mgba/build
          EXE="$PWD/qt/mGBA.exe"
          test -f "$EXE"

          rm -rf /tmp/mgba-package
          mkdir -p /tmp/mgba-package

          # Start from the real Qt executable.
          cp "$EXE" /tmp/mgba-package/mGBA.exe

          # MSYS2's current Qt5 package ships windeployqt-qt5 but names qmake
          # qmake-qt5.exe; provide the qmake.exe name windeployqt expects.
          cp -f /ucrt64/bin/qmake-qt5.exe /ucrt64/bin/qmake.exe

          # Deploy the Qt5 runtime and plugins.
          windeployqt-qt5 --release --no-translations --no-opengl-sw --dir /tmp/mgba-package "$EXE"

          # Add the complete MinGW/UCRT dependency closure of mGBA.
          # ntldd can return non-zero for optional/unresolved system DLLs; keep
          # packaging alive while copying every DLL it can resolve.
          (
            ntldd -R "$EXE" || true
          ) |
            awk -F' => ' '/ => / {print $2}' |
            sed -E 's/ \(0x[0-9A-Fa-f]+\)$//' |
            while IFS= read -r DLL; do
              [ -f "$DLL" ] && cp -u "$DLL" /tmp/mgba-package/
            done

          # Match the portable layout of the release: docs, bundled licenses, and portable.ini.
          cp ../CHANGES ../LICENSE ../README.md ../README_DE.md ../README_ES.md ../README_ZH_CN.md /tmp/mgba-package/
          mkdir -p /tmp/mgba-package/licenses
          cp ../res/licenses/*.txt /tmp/mgba-package/licenses/
          : > /tmp/mgba-package/portable.ini

          cd ../..
          OUT="$PWD/mGBA-0.10.5-X-Y-win64.zip"
          rm -f "$OUT"
          (cd /tmp/mgba-package && zip -qr "$OUT" .)
          test -s "$OUT"
          unzip -l "$OUT" | grep -Ei '(^|/)mGBA\.exe$|portable\.ini'

      - name: Upload finished package
        uses: actions/upload-artifact@v4
        with:
          name: mGBA-0.10.5-X-Y-win64
          path: mGBA-0.10.5-X-Y-win64.zip
          if-no-files-found: error
