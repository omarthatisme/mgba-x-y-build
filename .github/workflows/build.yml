name: Build mGBA 0.10.5 X/Y Windows x64

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Check out build files
        uses: actions/checkout@v4

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            unzip
            zip
            mingw-w64-ucrt-x86_64-ntldd-git
          pacboy: >-
            toolchain:p
            cmake:p
            ninja:p
            ffmpeg:p
            libelf:p
            libepoxy:p
            libzip:p
            lua:p
            pkgconf:p
            qt5:p
            SDL2:p

      - name: Check out upstream mGBA 0.10.5
        run: git clone --depth 1 --branch 0.10.5 https://github.com/mgba-emu/mgba.git mgba

      - name: Apply X/Y input patch
        run: |
          cd mgba
          git apply --check ../.github/mgba-x-y.patch
          git apply ../.github/mgba-x-y.patch
          git diff --check
          git diff --stat

      - name: Configure
        run: |
          cd mgba
          cmake -S . -B build -G Ninja             -DCMAKE_BUILD_TYPE=Release             -DCMAKE_POLICY_VERSION_MINIMUM=3.5             -DDISTBUILD=ON             -DBUILD_QT=ON             -DBUILD_SDL=ON

      - name: Build
        run: |
          cd mgba
          cmake --build build --parallel $(nproc)

      - name: Package clean Qt build
        run: |
          cd mgba/build
          cpack -G ZIP
          ZIP_FILE=$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)
          test -n "$ZIP_FILE"
          rm -rf /tmp/mgba-package
          mkdir -p /tmp/mgba-package
          unzip -q "$ZIP_FILE" -d /tmp/mgba-package
          find /tmp/mgba-package -type f \( -iname 'mgba-sdl.exe' -o -iname 'mgba-sdl*.dll' \) -delete
          cd ../..
          rm -f mGBA-0.10.5-X-Y-win64.zip
          (cd /tmp/mgba-package && zip -qr "$OLDPWD/mGBA-0.10.5-X-Y-win64.zip" .)
          unzip -l mGBA-0.10.5-X-Y-win64.zip | grep -Ei 'mgba\.exe|mgba-sdl\.exe|portable\.ini' || true

      - name: Upload finished package
        uses: actions/upload-artifact@v4
        with:
          name: mGBA-0.10.5-X-Y-win64
          path: mGBA-0.10.5-X-Y-win64.zip
          if-no-files-found: error
