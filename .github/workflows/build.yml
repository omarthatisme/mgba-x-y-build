name: Build mGBA 0.10.5 X/Y Windows x64

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            zip
            mingw-w64-ucrt-x86_64-ntldd-git
          pacboy: >-
            toolchain:p
            cmake:p
            ninja:p
            ffmpeg:p
            libelf:p
            libepoxy:p
            libzip:p
            lua:p
            pkgconf:p
            qt5:p
            SDL2:p

      - name: Check out upstream mGBA 0.10.5
        run: git clone --depth 1 --branch 0.10.5 https://github.com/mgba-emu/mgba.git mgba

      - name: Apply X/Y input patch
        run: |
          cd mgba
          cat > /tmp/mgba-x-y.patch <<'PATCH'
--- a/include/mgba/internal/gba/input.h
+++ b/include/mgba/internal/gba/input.h
@@ -25,6 +25,8 @@
 	GBA_KEY_DOWN = 7,
 	GBA_KEY_R = 8,
 	GBA_KEY_L = 9,
+	GBA_KEY_X = 10,
+	GBA_KEY_Y = 11,
 	GBA_KEY_MAX,
 	GBA_KEY_NONE = -1
 };
--- a/src/gba/input.c
+++ b/src/gba/input.c
@@ -19,7 +19,9 @@
 		"Up",
 		"Down",
 		"R",
-		"L"
+		"L",
+		"X",
+		"Y"
 	},
 	.nKeys = GBA_KEY_MAX,
 	.hat = {
--- a/src/gba/gba.c
+++ b/src/gba/gba.c
@@ -94,7 +94,7 @@
 	GBAHardwareInit(&gba->memory.hw, NULL);
 
 	gba->keysActive = 0;
-	gba->keysLast = 0x400;
+	gba->keysLast = 0x1000;
 	gba->rotationSource = NULL;
 	gba->luminanceSource = NULL;
 	gba->rtcSource = NULL;
@@ -214,7 +214,7 @@
 	gba->earlyExit = false;
 	gba->dmaPC = 0;
 	gba->biosStall = 0;
-	gba->keysLast = 0x400;
+	gba->keysLast = 0x1000;
 	if (gba->yankedRomSize) {
 		gba->memory.romSize = gba->memory.romSize;
 		gba->memory.romMask = toPow2(gba->memory.romSize) - 1;
@@ -934,7 +934,7 @@
 	gba->keysLast = keysActive;
 	int isAnd = keycnt & 0x8000;
 
-	keycnt &= 0x3FF;
+	keycnt &= 0x0FFF;
 	if (isAnd && keycnt == (keysActive & keycnt)) {
 		if (keysLast == keysActive) {
 			return;
@@ -943,7 +943,7 @@
 	} else if (!isAnd && (keysActive & keycnt)) {
 		GBARaiseIRQ(gba, GBA_IRQ_KEYPAD, 0);
 	} else {
-		gba->keysLast = 0x400;
+		gba->keysLast = 0x1000;
 	}
 }
--- a/src/gba/io.c
+++ b/src/gba/io.c
@@ -334,7 +334,7 @@
 void GBAIOInit(struct GBA* gba) {
 	gba->memory.io[REG_DISPCNT >> 1] = 0x0080;
 	gba->memory.io[REG_RCNT >> 1] = RCNT_INITIAL;
-	gba->memory.io[REG_KEYINPUT >> 1] = 0x3FF;
+	gba->memory.io[REG_KEYINPUT >> 1] = 0x0FFF;
 	gba->memory.io[REG_SOUNDBIAS >> 1] = 0x200;
 	gba->memory.io[REG_BG2PA >> 1] = 0x100;
 	gba->memory.io[REG_BG2PD >> 1] = 0x100;
@@ -557,8 +557,8 @@
 
 	// Interrupts and misc
 	case REG_KEYCNT:
-		value &= 0xC3FF;
-		if (gba->keysLast < 0x400) {
+		value &= 0xCFFF;
+		if (gba->keysLast < 0x1000) {
 			gba->keysLast &= gba->memory.io[address >> 1] | ~value;
 		}
 		gba->memory.io[address >> 1] = value;
@@ -863,7 +863,7 @@
 			if (!allowOpposingDirections) {
 				unsigned rl = input & 0x030;
 				unsigned ud = input & 0x0C0;
-				input &= 0x30F;
+				input &= 0xF30F;
 				if (rl != 0x030) {
 					input |= rl;
 				}
@@ -871,7 +871,7 @@
 					input |= ud;
 				}
 			}
-			gba->memory.io[address >> 1] = 0x3FF ^ input;
+			gba->memory.io[address >> 1] = 0x0FFF ^ input;
 		}
 		break;
 	case REG_SIOCNT:
--- a/src/platform/qt/GBAKeyEditor.h
+++ b/src/platform/qt/GBAKeyEditor.h
@@ -79,6 +79,8 @@
 	KeyEditor* m_keyB;
 	KeyEditor* m_keyL;
 	KeyEditor* m_keyR;
+	KeyEditor* m_keyX;
+	KeyEditor* m_keyY;
 	QList<KeyEditor*> m_keyOrder;
 	QList<KeyEditor*>::iterator m_currentKey;
 
--- a/src/platform/qt/GBAKeyEditor.cpp
+++ b/src/platform/qt/GBAKeyEditor.cpp
@@ -48,6 +48,8 @@
 	m_keyB = new KeyEditor(this);
 	m_keyL = new KeyEditor(this);
 	m_keyR = new KeyEditor(this);
+	m_keyX = new KeyEditor(this);
+	m_keyY = new KeyEditor(this);
 
 	refresh();
 
@@ -113,7 +115,9 @@
 		m_keySelect,
 		m_keyStart,
 		m_keyL,
-		m_keyR
+		m_keyR,
+		m_keyX,
+		m_keyY
 	};
 
 	for (auto& key : m_keyOrder) {
@@ -151,6 +155,8 @@
 	setLocation(m_keyL, 0.1, 0.1);
 	setLocation(m_keyR, 0.9, 0.1);
+	setLocation(m_keyX, 0.1, 0.18);
+	setLocation(m_keyY, 0.9, 0.18);
 
 	if (m_profileSelect) {
 		setLocation(m_profileSelect, 0.5, 0.67);
@@ -228,6 +234,8 @@
 	bindKey(m_keyB, GBA_KEY_B);
 	bindKey(m_keyL, GBA_KEY_L);
 	bindKey(m_keyR, GBA_KEY_R);
+	bindKey(m_keyX, GBA_KEY_X);
+	bindKey(m_keyY, GBA_KEY_Y);
 	m_controller->saveConfiguration(m_type);
 
 #ifdef BUILD_SDL
@@ -253,6 +261,8 @@
 	lookupBinding(map, m_keyB, GBA_KEY_B);
 	lookupBinding(map, m_keyL, GBA_KEY_L);
 	lookupBinding(map, m_keyR, GBA_KEY_R);
+	lookupBinding(map, m_keyX, GBA_KEY_X);
+	lookupBinding(map, m_keyY, GBA_KEY_Y);
 
 #ifdef BUILD_SDL
 	lookupAxes(map);
@@ -376,6 +386,10 @@
 		return m_keyL;
 	case GBA_KEY_R:
 		return m_keyR;
+	case GBA_KEY_X:
+		return m_keyX;
+	case GBA_KEY_Y:
+		return m_keyY;
 	case GBA_KEY_SELECT:
 		return m_keySelect;
 	case GBA_KEY_START:
--- a/src/platform/qt/InputProfile.cpp
+++ b/src/platform/qt/InputProfile.cpp
@@ -178,6 +178,8 @@
 		keys.keyDown,
 		keys.keyR,
 		keys.keyL,
+		-1,
+		-1,
 	}
 	, m_axes {
 		axes.keyA,
@@ -190,6 +190,8 @@
 		axes.keyDown,
 		axes.keyR,
 		axes.keyL,
+		{ GamepadAxisEvent::Direction::NEUTRAL, -1 },
+		{ GamepadAxisEvent::Direction::NEUTRAL, -1 },
 	}
 	, m_shortcutButtons(shortcutButtons)
 	, m_shortcutAxes(shortcutAxes)
PATCH

          git apply --check /tmp/mgba-x-y.patch
          git apply /tmp/mgba-x-y.patch
          git diff --check
          git diff --stat

      - name: Configure
        run: |
          cd mgba
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DDISTBUILD=ON \
            -DBUILD_QT=ON \
            -DBUILD_SDL=ON

      - name: Build
        run: |
          cd mgba
          cmake --build build --parallel $(nproc)

      - name: Package
        run: |
          cd mgba/build
          cpack -G ZIP
          ZIP_FILE=$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)
          test -n "$ZIP_FILE"
          cp "$ZIP_FILE" ../../mGBA-0.10.5-X-Y-win64.zip
          cd ../..
          unzip -l mGBA-0.10.5-X-Y-win64.zip | grep -Ei 'mGBA\\.exe|mgba-sdl\\.exe|portable\\.ini' || true

      - name: Upload finished package
        uses: actions/upload-artifact@v4
        with:
          name: mGBA-0.10.5-X-Y-win64
          path: mGBA-0.10.5-X-Y-win64.zip
          if-no-files-found: error
