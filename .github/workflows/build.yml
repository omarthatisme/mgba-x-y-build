name: Build mGBA 0.10.5 X/Y Windows x64 (official static toolchain)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out build files
        uses: actions/checkout@v4

      - name: Install 7-Zip
        run: |
          if ! command -v 7z >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y p7zip-full
          fi

      - name: Pull pinned upstream Windows build image
        run: |
          docker pull mgba/windows@sha256:065605a634c59d3a6f52adf08cd59e39fa025b79cc46cc7f841bfbb20bfd3bf6

      - name: Check out upstream mGBA 0.10.5
        run: |
          git clone --depth 1 --branch 0.10.5 https://github.com/mgba-emu/mgba.git mgba

      - name: Apply X/Y source edits
        run: |
          python3 .github/apply_xy.py
          cd mgba
          git diff --check
          git diff --stat

      - name: Build with upstream static Windows toolchain
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e CCACHE_DISABLE=1 \
            -e MAKEFLAGS="-j$(nproc)" \
            -v "$GITHUB_WORKSPACE/mgba:/home/mgba/src" \
            mgba/windows@sha256:065605a634c59d3a6f52adf08cd59e39fa025b79cc46cc7f841bfbb20bfd3bf6

      - name: Assemble static portable package
        run: |
          IMAGE='mgba/windows@sha256:065605a634c59d3a6f52adf08cd59e39fa025b79cc46cc7f841bfbb20bfd3bf6'

          rm -rf mgba/package
          mkdir -p mgba/package

          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -v "$GITHUB_WORKSPACE/mgba:/home/mgba/src" \
            "$IMAGE" \
            sh -lc '
              cmake --install build-win64 --component mgba-qt --prefix /home/mgba/src/package
              cmake --install build-win64 --component mgba-sdl --prefix /home/mgba/src/package
              mkdir -p /home/mgba/src/package/licenses
              cp -a /opt/licenses/. /home/mgba/src/package/licenses/
              x86_64-w64-mingw32-strip /home/mgba/src/package/mGBA.exe
              x86_64-w64-mingw32-strip /home/mgba/src/package/mgba-sdl.exe
            '

          # Official mGBA distribution builds include portable.ini so Windows stores
          # config.ini and qt.ini beside the emulator rather than under %APPDATA%.
          : > mgba/package/portable.ini

          cp mgba/README*.md mgba/package/
          cp mgba/CHANGES mgba/package/
          cp mgba/LICENSE mgba/package/

          test -f mgba/package/mGBA.exe
          test -f mgba/package/mgba-sdl.exe

          echo "Package contents:"
          find mgba/package -type f -printf '%P\n' | sort

          echo "Imported Windows DLLs:"
          objdump -p mgba/package/mGBA.exe | sed -n '/The Import Tables/,/The Exception Table/p' | grep -E 'DLL Name:|DLL Name' || true

          # Fail only if an actual third-party/dev library was installed.
          mapfile -t EXTRA_LIBS < <(find mgba/package -type f | grep -E '\\.(dll|a)$' || true)
          if [ "${#EXTRA_LIBS[@]}" -ne 0 ]; then
            echo "Unexpected dynamic/dev library found in portable package:" >&2
            printf '%s\n' "${EXTRA_LIBS[@]}" >&2
            exit 1
          fi

          rm -f mGBA-0.10.5-X-Y-win64.7z
          7z a -t7z -mx=9 mGBA-0.10.5-X-Y-win64.7z ./mgba/package/*

          test -s mGBA-0.10.5-X-Y-win64.7z
          sha256sum mGBA-0.10.5-X-Y-win64.7z
          7z l mGBA-0.10.5-X-Y-win64.7z | sed -n '1,180p'

      - name: Upload finished package
        uses: actions/upload-artifact@v4
        with:
          name: mGBA-0.10.5-X-Y-win64
          path: mGBA-0.10.5-X-Y-win64.7z
          if-no-files-found: error
