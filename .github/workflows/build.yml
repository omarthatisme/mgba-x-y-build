name: Build mGBA 0.10.5 X/Y Windows x64

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Check out build files
        uses: actions/checkout@v4

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            unzip
            zip
            mingw-w64-ucrt-x86_64-ntldd-git
          pacboy: >-
            toolchain:p
            cmake:p
            ninja:p
            ffmpeg:p
            libelf:p
            libepoxy:p
            libzip:p
            lua:p
            pkgconf:p
            qt5:p
            qt5-tools:p
            SDL2:p

      - name: Check out upstream mGBA 0.10.5
        run: git clone --depth 1 --branch 0.10.5 https://github.com/mgba-emu/mgba.git mgba

      - name: Apply X/Y source edits
        run: |
          python .github/apply_xy.py
          cd mgba
          git diff --check
          git diff --stat

      - name: Configure
        run: |
          cd mgba
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DDISTBUILD=ON -DBUILD_QT=ON -DBUILD_SDL=ON

      - name: Build
        run: |
          cd mgba
          cmake --build build --parallel $(nproc)

      - name: Package clean Qt build
        run: |
          cd mgba/build
          EXE="$PWD/qt/mGBA.exe"
          test -f "$EXE"

          rm -rf /tmp/mgba-package
          mkdir -p /tmp/mgba-package

          # Put the actual Qt executable at the package root.
          cp "$EXE" /tmp/mgba-package/mGBA.exe

          # Copy runtime DLLs from the UCRT64 runtime directory. This avoids
          # depending on the exact Qt package split/path used by the runner.
          for DLL in /ucrt64/bin/*.dll; do
            [ -f "$DLL" ] && cp -u "$DLL" /tmp/mgba-package/
          done

          # Find the Qt Windows platform plugin and copy it to the standard
          # portable Qt location expected beside mGBA.exe.
          QWINDOWS="$(find /ucrt64 -type f -name qwindows.dll -print -quit 2>/dev/null || true)"
          if [ -z "$QWINDOWS" ]; then
            echo "ERROR: qwindows.dll was not found under /ucrt64"
            find /ucrt64 -type f -iname '*qwindows*.dll' -print 2>/dev/null || true
            exit 1
          fi
          mkdir -p /tmp/mgba-package/platforms
          cp -u "$QWINDOWS" /tmp/mgba-package/platforms/qwindows.dll

          # Copy the rest of the Qt plugin DLLs from the same plugin tree when
          # possible, keeping only runtime DLLs and their normal subdirectories.
          PLUGIN_BASE="$(dirname "$(dirname "$QWINDOWS")")"
          while IFS= read -r DLL; do
            REL="${DLL#"$PLUGIN_BASE/"}"
            [ "$REL" = "platforms/qwindows.dll" ] && continue
            mkdir -p "/tmp/mgba-package/$(dirname "$REL")"
            cp -u "$DLL" "/tmp/mgba-package/$REL"
          done < <(find "$PLUGIN_BASE" -type f -name '*.dll' -print 2>/dev/null || true)
          # Add the complete MinGW/UCRT dependency closure reported by ntldd.
          # The command can return non-zero for Windows system DLLs, so its
          # output is captured without making the packaging step fail.
          ntldd -R "$EXE" > /tmp/mgba-ntldd.txt 2>&1 || true
          while IFS= read -r DLL; do
            [ -f "$DLL" ] && cp -u "$DLL" /tmp/mgba-package/
          done < <(
            sed -nE 's/^.* => ([A-Za-z]:[^ ]+)( ([^)]*\))?$/\1/p' /tmp/mgba-ntldd.txt |
              sed 's#\\#/#g'
          )

          # Common MSYS2 runtime DLLs, when present.
          for DLL in /ucrt64/bin/zlib1.dll /ucrt64/bin/libpng16-16.dll /ucrt64/bin/SDL2.dll; do
            [ -f "$DLL" ] && cp -u "$DLL" /tmp/mgba-package/
          done

          # Match the portable layout of the official release: docs, licenses,
          # and an empty portable.ini.
          cp ../CHANGES ../LICENSE ../README.md ../README_DE.md ../README_ES.md ../README_ZH_CN.md /tmp/mgba-package/
          mkdir -p /tmp/mgba-package/licenses
          cp ../res/licenses/*.txt /tmp/mgba-package/licenses/
          : > /tmp/mgba-package/portable.ini

          # Sanity-check the package before creating the artifact.
          test -f /tmp/mgba-package/mGBA.exe
          test -f /tmp/mgba-package/portable.ini
          test -f /tmp/mgba-package/platforms/qwindows.dll

          cd ../..
          OUT="$PWD/mGBA-0.10.5-X-Y-win64.zip"
          rm -f "$OUT"
          (cd /tmp/mgba-package && zip -qr "$OUT" .)
          test -s "$OUT"
          unzip -l "$OUT" | grep -Ei '(^|/)mGBA\.exe$|portable\.ini|platforms/qwindows\.dll'

      - name: Upload finished package
        uses: actions/upload-artifact@v4
        with:
          name: mGBA-0.10.5-X-Y-win64
          path: mGBA-0.10.5-X-Y-win64.zip
          if-no-files-found: error
